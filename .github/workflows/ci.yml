# Every push and pull request: all tests, type checks, lint, accessibility, performance budget, security scans,
# and a production image build. Nothing here deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_PASSWORD: lifeos_ci_only
  TEST_DATABASE_URL: postgresql+psycopg://lifeos:lifeos_ci_only@127.0.0.1:5432/lifeos_test
  E2E_DATABASE_URL: postgresql+psycopg://lifeos:lifeos_ci_only@127.0.0.1:5432/lifeos_e2e
  DATABASE_URL: postgresql+psycopg://lifeos:lifeos_ci_only@127.0.0.1:5432/lifeos_e2e

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: lifeos, POSTGRES_PASSWORD: lifeos_ci_only, POSTGRES_DB: lifeos_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lifeos" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - name: Tests (includes migrations up/down, backup round trip, performance budget)
        run: python -m pytest
      - name: Known vulnerabilities in Python dependencies
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint src
      - run: npm test
      - run: npm run build
      - name: Performance budget
        run: npm run check:bundle
      - name: Known vulnerabilities in shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: lifeos, POSTGRES_PASSWORD: lifeos_ci_only, POSTGRES_DB: lifeos_e2e }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lifeos" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ./backend
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser tests (flows, real offline, installability, accessibility)
        run: npm run e2e
        working-directory: frontend
        env: { E2E_PYTHON: python }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the whole history, not just the last commit
      - name: Secrets scan
        run: python infra/security/secret_scan.py .

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production image builds
        run: docker build -t lifeos:ci .
