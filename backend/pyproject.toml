[project]
name = "lifeos-backend"
version = "0.1.0"
description = "Personal Life OS — Flask API"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1,<4",
  "flask-sqlalchemy>=3.1,<4",
  "flask-migrate>=4.1,<5",
  "sqlalchemy>=2.0.40,<3",
  "psycopg[binary]>=3.2.10,<4",
  "pydantic>=2.11,<3",
  "argon2-cffi>=25.1,<26",
  "flask-limiter>=3.12,<5",
  "python-dotenv>=1.1,<2",
  "tzdata>=2025.2",  # timezone database (Windows has none built in)
  "python-dateutil>=2.9,<3",  # RFC 5545 recurrence rules (RRULE)
  "anthropic>=2.1,<3",  # optional AI assistance (Stage 7); unused without an API key
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pip-audit>=2.9,<3"]
prod = ["gunicorn>=25,<27"]  # production web server (Linux; used in the Docker image)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
