# Render Blueprint (docs/04-deployment.md §3): one free web service built from the Dockerfile, in Singapore.
# The database is NOT here: use Neon's free PostgreSQL and paste its *direct* connection string as DATABASE_URL
# when Render asks (the pooled "-pooler" address doesn't suit this app's driver).
services:
  - type: web
    name: life-os
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false # asked for when the Blueprint is created; never committed
      - key: SECRET_KEY
        generateValue: true # random, made by Render once; changing it later signs everyone out
      - key: TRUST_PROXY
        value: "true"
